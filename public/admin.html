<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Passcodes & Users</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">⚡ Admin Control Panel</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="admin.html">Admin</a>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Passcode Generator</h2>
      <p style="color: var(--text-muted); margin: 10px 0 20px 0;">Generate secure login access keys for clients.</p>
      <button class="btn" onclick="generatePasscode()">Generate New Passcode</button>
      <div id="generatedKey" style="margin-top: 20px; font-size: 18px; color: var(--accent-green); font-weight: bold;"></div>
    </div>

    <div class="card">
      <h2>System Status</h2>
      <p>Supabase Database: <span style="color: var(--accent-green);">Connected</span></p>
      <p style="margin-top: 10px;">Bybit API Gateway: <span style="color: var(--accent-green);">Active</span></p>
    </div>
  </div>

  <script src="script.js"></script>

</html>
