<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Mobile View</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div class="container">
        <h1>Admin Control Panel</h1>
        <p>Monitor live user balances, active trades, and deposit/withdrawal requests from your mobile device.</p>
        
        <div class="admin-section">
            <h2>User Balances</h2>
            <table id="usersTable">
                <thead>
                    <tr><th>User</th><th>Balance</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="admin-section">
            <h2>Deposit / Withdrawal Requests</h2>
            <table id="txTable">
                <thead>
                    <tr><th>User</th><th>Type</th><th>Amount</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="admin-section">
            <h2>Active Trades</h2>
            <table id="tradesTable">
                <thead>
                    <tr><th>User</th><th>Symbol</th><th>Amount</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        
        <a href="index.html" class="btn-back">← Back to Home</a>
    </div>

    <script>
        async function fetchAdminData() {
            try {
                const res = await fetch('/api/admin/data');
                const data = await res.json();
                if(data.success) {
                    let uHtml = '';
                    data.users.forEach(u => uHtml += `<tr><td>${u.username}</td><td>$${u.balance}</td></tr>`);
                    document.querySelector('#usersTable tbody').innerHTML = uHtml;

                    let tHtml = '';
                    data.transactions.forEach(tx => tHtml += `<tr><td>${tx.username}</td><td><b>${tx.type}</b></td><td>$${tx.amount}</td><td>${tx.status}</td></tr>`);
                    document.querySelector('#txTable tbody').innerHTML = tHtml;

                    let trHtml = '';
                    data.trades.forEach(tr => trHtml += `<tr><td>${tr.username}</td><td>${tr.symbol}</td><td>$${tr.amount}</td><td>${tr.status}</td></tr>`);
                    document.querySelector('#tradesTable tbody').innerHTML = trHtml;
                }
            } catch (err) {
                console.error(err);
            }
        }
        setInterval(fetchAdminData, 3000);
        fetchAdminData();
    </script>
</body>
</html>
