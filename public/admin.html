<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel - Bybit Trading Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div class="container">
        <h1>Admin Control Panel</h1>
        <p>Manage users, live balances, and active trades in real-time.</p>
        
        <div class="admin-section">
            <h2>Registered Users & Balances</h2>
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Balance ($)</th>
                        <th>Joined At</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamic data will load here -->
                </tbody>
            </table>
        </div>

        <div class="admin-section">
            <h2>Active & Past Trades History</h2>
            <table id="tradesTable">
                <thead>
                    <tr>
                        <th>Trade ID</th>
                        <th>Username</th>
                        <th>Symbol</th>
                        <th>Amount ($)</th>
                        <th>Status</th>
                        <th>PnL ($)</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamic data will load here -->
                </tbody>
            </table>
        </div>
        
        <br>
        <a href="index.html" class="btn-back">Back to Trading Bot</a>
    </div>

    <script>
        async function fetchAdminData() {
            try {
                const response = await fetch('/api/admin/data');
                const data = await response.json();
                if(data.success) {
                    // Populate Users
                    const userTableBody = document.querySelector('#usersTable tbody');
                    userTableBody.innerHTML = '';
                    data.users.forEach(user => {
                        userTableBody.innerHTML += `<tr><td>${user.id}</td><td>${user.username}</td><td>$${user.balance}</td><td>${user.created_at}</td></tr>`;
                    });

                    // Populate Trades
                    const tradeTableBody = document.querySelector('#tradesTable tbody');
                    tradeTableBody.innerHTML = '';
                    data.trades.forEach(trade => {
                        tradeTableBody.innerHTML += `<tr><td>${trade.id}</td><td>${trade.username}</td><td>${trade.symbol}</td><td>$${trade.amount}</td><td>${trade.status}</td><td>$${trade.pnl}</td></tr>`;
                    });
                }
            } catch (err) {
                console.error('Error fetching admin data:', err);
            }
        }
        setInterval(fetchAdminData, 3000); // Real-time sync every 3 seconds
        fetchAdminData();
    </script>
</body>
</html>
