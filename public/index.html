<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Crypto Signals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 Malik Crypto Signals</h1>
            <p>Real-time professional trading signals & alerts</p>
        </header>
        
        <!-- Push Notification Banner -->
        <div class="card" style="text-align: center;">
            <h3 style="border: none; margin-bottom: 5px;">🔔 Live Push Notifications</h3>
            <p style="font-size: 13px; color: #64748b; margin-top: 0;">Get instant alerts on your device when a new signal drops.</p>
            <button class="btn-notification" onclick="requestNotificationPermission()">Enable Notifications</button>
        </div>

        <!-- Admin Broadcast Panel -->
        <div class="card" id="admin-panel">
            <h3>🛠️ Admin Signal Broadcast Panel</h3>
            
            <label>Admin Password</label>
            <input type="password" id="admin-pass" placeholder="Enter admin password">

            <label>Coin Symbol</label>
            <input type="text" id="trade-symbol" placeholder="e.g., BTCUSDT">

            <label>Signal Type</label>
            <select id="trade-type">
                <option value="LONG">LONG (Buy)</option>
                <option value="SHORT">SHORT (Sell)</option>
            </select>

            <label>Entry Price</label>
            <input type="number" id="trade-entry" placeholder="e.g., 65000">

            <label>Target Price</label>
            <input type="number" id="trade-target" placeholder="e.g., 68000">

            <label>Stop Loss</label>
            <input type="number" id="trade-sl" placeholder="e.g., 64000">

            <button onclick="broadcastSignal()">Broadcast Signal to Users</button>
        </div>

        <!-- Live Signals Table -->
        <div class="card">
            <h3>📡 Live Signal Stream</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Pair</th>
                            <th>Type</th>
                            <th>Entry</th>
                            <th>Target</th>
                            <th>SL</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="signals-tbody">
                        <tr><td colspan="6" style="text-align: center; color: #94a3b8;">Connecting to live stream...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
