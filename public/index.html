<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Algo Trading Bot</title>
    <style>
        body {
            background-color: #0b0e11;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .config-card {
            background: #181a20;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #848e9c;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background: #2b313a;
            border: none;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-start {
            background: #0ecb81;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
        }
        .btn-stop {
            background: #f6465d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
        }
        #error-box {
            background: rgba(246, 70, 93, 0.15);
            border: 1px solid #f6465d;
            color: #f6465d;
            padding: 12px;
            border-radius: 4px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="config-card">
        <h2>Smart Algo Config</h2>
        
        <div class="form-group">
            <label>Strategy Mode</label>
            <select id="strategyMode">
                <option>FMA Strategy</option>
            </select>
        </div>

        <div class="form-group">
            <label>Capital Allocation ($ USDT)</label>
            <input type="number" id="capitalInput" value="500">
        </div>

        <div class="form-group">
            <label>Risk Per Trade (%)</label>
            <input type="number" id="riskInput" value="2.0">
        </div>

        <div class="btn-container">
            <button class="btn-start" id="startBotBtn">▶ Start Live Bot</button>
            <button class="btn-stop" id="stopBotBtn">■ Stop Bot</button>
        </div>

        <div id="error-box"></div>
    </div>

    <script>
        document.getElementById('startBotBtn').addEventListener('click', async () => {
            const capital = document.getElementById('capitalInput').value;
            
            const tradeData = {
                symbol: 'BTCUSDT',
                side: 'Buy',
                orderType: 'Market',
                qty: capital,
                testnet: false
            };

            await handleTradeExecution(tradeData);
        });

        async function handleTradeExecution(tradeData) {
            try {
                clearErrors();

                const response = await fetch('/api/bybit/trade', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(tradeData)
                });

                const result = await response.json();

                // If response is not ok or success is false, display error and STOP immediately
                if (!response.ok || !result.success) {
                    let errorMsg = result.error || 'Failed to process request. Please check configuration.';
                    
                    // Remove any reference to specific exchange names from the error
                    errorMsg = errorMsg.replace(/Bybit/gi, 'Trading');

                    showErrorAlert(errorMsg);
                    return; // Crucial: prevents success popup from showing on error
                }

                // Triggers ONLY when trade execution is fully verified and successful
                showSuccessAlert('Bot started successfully with automated execution!');

            } catch (err) {
                let cleanError = err.message ? err.message.replace(/Bybit/gi, 'Trading') : 'An unexpected error occurred.';
                showErrorAlert(cleanError);
            }
        }

        function showErrorAlert(message) {
            const errorBox = document.getElementById('error-box');
            errorBox.innerText = `Error: ${message}`;
            errorBox.style.display = 'block';
        }

        function showSuccessAlert(message) {
            alert(message);
        }

        function clearErrors() {
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'none';
            errorBox.innerText = '';
        }
    </script>
</body>
</html>
