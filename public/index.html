<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoSignals - Live Spot Signal Broadcast</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for High-End Financial Look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">⚡</span>
            <h1>CRYPTO<span class="highlight">SIGNALS</span></h1>
        </div>
        <div class="nav-actions">
            <div class="live-status">
                <span class="pulse-dot"></span> Live Feed
            </div>
            <button id="openAdminBtn" class="btn-admin">Admin Portal</button>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="dashboard">
        <section class="hero-section">
            <h2>Real-Time Spot Trading Broadcasts</h2>
            <p>Instant professional signal execution feeds configured for high-precision spot market trading.</p>
        </section>

        <!-- Signal Feed Grid -->
        <section class="feed-container">
            <h3>Active Broadcasted Signals</h3>
            <div id="signalsGrid" class="signals-grid">
                <!-- Signals will load dynamically here with smooth animations -->
                <div class="empty-state">Waiting for live broadcasted signals...</div>
            </div>
        </section>
    </main>

    <!-- Admin Broadcast Modal Drawer -->
    <div id="adminModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Admin Signal Broadcast</h3>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>

            <div id="loginSection" class="auth-section">
                <p>Enter Admin Password to Unlock Broadcasting</p>
                <input type="password" id="adminPasswordInput" placeholder="Password (MalikKaBot)" autocomplete="current-password">
                <button id="loginBtn" class="btn-primary">Unlock Panel</button>
            </div>

            <div id="broadcastSection" class="broadcast-form-section" style="display: none;">
                <form id="broadcastForm">
                    <div class="form-group">
                        <label>Trading Symbol</label>
                        <input type="text" id="symbolInput" placeholder="e.g. BTCUSDT" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Trade Type</label>
                            <select id="tradeTypeInput">
                                <option value="BUY">BUY (Long)</option>
                                <option value="SELL">SELL (Short/Exit)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Order Type</label>
                            <select id="orderTypeInput">
                                <option value="Market Order">Market Order</option>
                                <option value="Limit Order">Limit Order</option>
                                <option value="Trailing TP/SL">Trailing TP/SL</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Entry Price</label>
                        <input type="text" id="entryInput" placeholder="e.g. 64200.00" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Target Price (TP)</label>
                            <input type="text" id="targetInput" placeholder="e.g. 67500.00" required>
                        </div>
                        <div class="form-group">
                            <label>Stop Loss (SL)</label>
                            <input type="text" id="stopLossInput" placeholder="e.g. 63000.00" required>
                        </div>
                    </div>

                    <button type="submit" id="broadcastBtn" class="btn-primary pulse-btn">Broadcast Signal</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
