<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Signals & Admin Broadcast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 Live Crypto Trading Signals</h1>
        
        <!-- Push Notification Permission Button -->
        <div class="card">
            <h3>🔔 Notifications</h3>
            <button onclick="requestNotificationPermission()">Enable Push Notifications</button>
        </div>

        <!-- Admin Panel for Executing Trades -->
        <div class="card" id="admin-panel">
            <h3>🛠️ Admin Trade Execution Panel</h3>
            <input type="text" id="trade-symbol" placeholder="Coin Symbol (e.g., BTCUSDT)">
            <select id="trade-type">
                <option value="LONG">LONG (Buy)</option>
                <option value="SHORT">SHORT (Sell)</option>
            </select>
            <input type="number" id="trade-entry" placeholder="Entry Price">
            <input type="number" id="trade-target" placeholder="Target Price">
            <input type="number" id="trade-sl" placeholder="Stop Loss">
            <button onclick="executeAndBroadcastTrade()">Execute & Broadcast Trade</button>
        </div>

        <!-- Live Trades Feed for Users -->
        <div class="card">
            <h3>📡 Live Signal Feed</h3>
            <table>
                <thead>
                    <tr>
                        <th>Pair</th>
                        <th>Type</th>
                        <th>Entry</th>
                        <th>Target</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="signals-tbody">
                    <tr><td colspan="5" style="text-align: center; color: #8b949e;">Loading live trades...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
